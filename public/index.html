<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f5f0" />
    <title>CS 2028 · 考研总览</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳至正文</a>
    <aside id="rail"></aside>
    <div class="shell">
      <header>
        <button
          class="mobile"
          id="menu"
          aria-controls="rail"
          aria-expanded="false"
          aria-label="导航菜单"
        >
          ☰
        </button>
        <div id="crumb">CS 2028 <span>/</span> <b></b></div>
        <button class="search" id="searchOpen" aria-label="全站搜索"></button>
      </header>
      <main id="main" tabindex="-1"><p>正在读取数据库…</p></main>
      <footer>CS 2028 <span>计算机考研与职业发展决策平台</span></footer>
    </div>
    <dialog id="searchDialog" class="overlay" aria-labelledby="searchTitle">
      <div class="section">
        <h2 id="searchTitle">全站搜索</h2>
        <button id="closeSearch" aria-label="关闭搜索">关闭</button>
      </div>
      <input
        id="searchInput"
        placeholder="输入院校、专业代码、岗位或公告"
        aria-label="搜索关键词"
        aria-controls="searchResults"
        autofocus
      />
      <div id="searchResults"></div>
    </dialog>
    <dialog id="previewDialog" class="overlay" aria-labelledby="previewTitle">
      <div class="preview-shell">
        <header class="preview-header">
          <div class="preview-nav" aria-label="浏览其他项目">
            <button type="button" data-action="previewStep" data-id="-1">
              上一个
            </button>
            <span id="previewPosition" class="num small"></span>
            <button type="button" data-action="previewStep" data-id="1">
              下一个
            </button>
          </div>
          <button
            type="button"
            id="closePreview"
            aria-label="关闭快速预览"
            autofocus
          >
            关闭
          </button>
        </header>
        <div id="previewBody"></div>
        <div id="previewNotice" role="status"></div>
      </div>
    </dialog>
    <div id="notice" role="status"></div>
  </body>
</html>
